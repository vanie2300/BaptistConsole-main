<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Presentation</title>
<meta name="viewport" content="width=1024, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../theme.css">
<script>
  (() => {
    const theme = localStorage.getItem('globalTheme');
    if (theme === 'dark') {
      document.documentElement.classList.add('theme-dark');
    } else if (theme === 'light') {
      document.documentElement.classList.add('theme-light');
    }
    const bg = localStorage.getItem('settings_presenterBg');
    const text = localStorage.getItem('settings_presenterText');
    const weight = localStorage.getItem('settings_presenterWeight');
    const font = localStorage.getItem('settings_presenterFont');
    if (bg) document.documentElement.style.setProperty('--present-bg', bg);
    if (text) document.documentElement.style.setProperty('--present-text', text);
    if (font) document.documentElement.style.setProperty('--present-font', font);
    if (weight) document.documentElement.style.setProperty('--present-weight', weight);
  })();
</script>
<style>
body {
    margin: 0;
    background: var(--present-bg, var(--bg));
    color: var(--present-text, var(--text));
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    font-family: var(--present-font, 'Segoe UI', 'Arial', sans-serif);
    font-weight: var(--present-weight, 400);
}
#bgImageLayer {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    z-index: -1;
    pointer-events: none;
    display: none;
}
#slideContent {
    width: 100vw;
    height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;       /* Center content vertically */
    align-items: center;           /* Center content horizontally */
    padding: 2vw 3vw;
    text-align: left;
    overflow-y: hidden;
    font-family: var(--present-font, 'Segoe UI', 'Arial', sans-serif);
    border: none;
    gap: 2vw;
    font-weight: bold;
    opacity: 1;
    transition: opacity 0.3s ease;
}
.slide-label {
    font-weight: bold;
    font-size: 2vw;
    margin: 0;
    padding: 0;
    width: 100%;
    text-align: left;
    color: var(--primary);
    letter-spacing: 0.05em;
    text-shadow: 0 2px 8px #000a;
    flex-shrink: 0;
}
.slide-title {
    font-weight: bold;
    font-size: 7vw;
    width: 100%;
 
    color: var(--present-text, var(--text));
    text-shadow: 0 2px 8px #000a;
   
    display: flex;
    justify-content: center;
    align-items: center;
}
.slide-lyrics {
    font-size: 1vw;
    line-height: 1.18;
    color: var(--present-text, var(--text));
    text-shadow: 0 2px 8px #000a;
    width: 100%;
    word-break: break-word;
    flex-shrink: 0;
    min-height: 0;
}
#slideContent.centered {
    justify-content: center !important;
    align-items: center !important;
}
@media (max-width: 700px) {
    #slideContent { padding: 4vw 2vw; }
    .slide-label { font-size: 6vw; }
    .slide-title { font-size: 10vw; }
    .slide-lyrics { font-size: 8vw; }
}
</style>
</head>
<body data-ui="hymn-presentation-body">
<!-- UI GROUP: Presentation Stage -->
<div id="bgImageLayer"></div>
<div id="slideContent" data-ui="hymn-presentation-stage"><em>Waiting for slides...</em></div>
<script src="../theme.js"></script>
<script>
let slides = [];
let currentIndex = 0;
let _hymnTransition = 'none';
let _fadeLock = false;

function maximizeWindow() {
    const isElectron = navigator.userAgent.toLowerCase().includes('electron');
    if (isElectron) return;
    try {
        window.moveTo(0, 0);
        window.resizeTo(screen.availWidth, screen.availHeight);
    } catch (err) {
        // Ignore resize errors (browser policy, etc).
    }
}

function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[m]);
}

function renderSlide(fade) {
    const slide = slides[currentIndex] || { lines: ['End of hymn'] };
    const container = document.getElementById('slideContent');
    const align = window._hymnAlign || localStorage.getItem('settings_hymnAlign') || 'center';
    const layout = window._hymnLayout || localStorage.getItem('settings_hymnLayout') || 'full';
    const showNumbers = window._hymnShowNumbers !== undefined ? window._hymnShowNumbers : (localStorage.getItem('settings_hymnShowNumbers') !== 'false');
    const titleSize = window._hymnTitleSize || Number(localStorage.getItem('settings_hymnTitleSize')) || 7;
    const slideFontSize = window._hymnFontSize || Number(localStorage.getItem('settings_hymnFontSize')) || 7;
    const lyricScale = slideFontSize / 7;
    const transition = _hymnTransition || 'none';

    function paintSlide() {
        container.style.textAlign = align;
        container.style.maxWidth = layout === 'compact' ? '70vw' : '100%';
        container.style.padding = layout === 'compact' ? '4vw 10vw' : '2vw 3vw';

        const weight = localStorage.getItem('settings_presenterWeight') || '600';
        const font = localStorage.getItem('settings_presenterFont') || "'Segoe UI', system-ui, sans-serif";

        if (slide.type === 'title') {
            container.classList.add('centered');
            container.innerHTML = `
                <div class="slide-title" id="autoFitTarget" style="font-size:${titleSize}vw; font-weight:${weight}; font-family:${font}">${escapeHtml(slide.title)}</div>
            `;
            autoFitText(document.getElementById('autoFitTarget'), titleSize, 2);
        } else {
            container.classList.remove('centered');
            const totalVerses = slides.reduce((m, s) => (s.type === 'verse' ? Math.max(m, s.number || 0) : m), 0);
            const label = slide.type === 'chorus'
                ? 'Chorus'
                : (slide.number === totalVerses ? 'Last verse' : `${slide.number}/${totalVerses}`);
            const content = (slide.lines || []).map(escapeHtml).join('<br>');
            if (showNumbers) {
                container.innerHTML = `
                    <div class="slide-label" id="autoFitLabel" style="font-weight:${weight}; font-family:${font}">${label}</div>
                    <div class="slide-lyrics" id="autoFitLyrics" style="font-weight:${weight}; font-family:${font}">${content}</div>
                `;
                autoFitText(document.getElementById('autoFitLyrics'), slideFontSize, 4, lyricScale);
                autoFitText(document.getElementById('autoFitLabel'), 3, 1.2, lyricScale);
            } else {
                container.innerHTML = `
                    <div class="slide-lyrics" id="autoFitLyrics" style="font-weight:${weight}; font-family:${font}">${content}</div>
                `;
                autoFitText(document.getElementById('autoFitLyrics'), slideFontSize, 4, lyricScale);
            }
        }
    }
    if (fade && transition === 'fade' && !_fadeLock) {
        _fadeLock = true;
        container.style.opacity = '0';
        setTimeout(() => {
            paintSlide();
            container.style.opacity = '1';
            setTimeout(() => { _fadeLock = false; }, 320);
        }, 300);
    } else {
        container.style.opacity = '1';
        paintSlide();
    }
}

function fileUrlCss(path) {
    return 'url("file:///' + String(path).replace(/\\/g, '/').replace(/[()'"]/g, (ch) => '\\' + ch) + '")';
}

function applyPresenterSettings() {
    const root = document.documentElement;
    const bg = localStorage.getItem('settings_presenterBg');
    const text = localStorage.getItem('settings_presenterText');
    const weight = localStorage.getItem('settings_presenterWeight');
    const font = localStorage.getItem('settings_presenterFont');
    const bgImage = localStorage.getItem('settings_hymnBgImage');
    const bgOpacity = localStorage.getItem('settings_hymnBgOpacity');

    if (bg) root.style.setProperty('--present-bg', bg);
    if (text) root.style.setProperty('--present-text', text);
    if (font) root.style.setProperty('--present-font', font);

    var bgLayer = document.getElementById('bgImageLayer');
    if (bgLayer) {
        if (bgImage) {
            bgLayer.style.backgroundImage = fileUrlCss(bgImage);
            bgLayer.style.opacity = String((Number(bgOpacity) || 30) / 100);
            bgLayer.style.display = 'block';
        } else {
            bgLayer.style.display = 'none';
        }
    }

    // Apply weight and font to all lyric/label/title elements
    document.querySelectorAll('.slide-lyrics, .slide-label, .slide-title').forEach((el) => {
        if (weight) el.style.fontWeight = weight;
        if (font) el.style.fontFamily = font;
    });
    renderSlide();
}

function applyThemeFromStorage() {
    const theme = localStorage.getItem('globalTheme');
    document.documentElement.classList.toggle('theme-dark', theme === 'dark');
    document.documentElement.classList.toggle('theme-light', theme === 'light');
}

function autoFitText(container, maxFont = 8, minFont = 4, scale = 1) {
    // Fit an element against the projection window's real width AND height
    // (the window is sized to the target screen). Binary-search for the
    // largest font-size (vw) that fits on both axes, within [minFont, maxFont],
    // then apply an optional scale multiplier (e.g. the slide-size slider).
    if (!container) return null;
    const parent = container.parentElement;
    if (!parent || container === parent) return null;
    const pStyle = getComputedStyle(parent);
    const availW = parent.clientWidth - (parseFloat(pStyle.paddingLeft || 0) + parseFloat(pStyle.paddingRight || 0));
    let availH = parent.clientHeight - (parseFloat(pStyle.paddingTop || 0) + parseFloat(pStyle.paddingBottom || 0));
    if (!availW || !availH) return null;

    // Reserve room for sibling elements (e.g. the verse label) so nothing clips.
    Array.from(parent.children).forEach(function (el) {
        if (el !== container) availH -= (el.offsetHeight || 0);
    });
    var gapMatch = /^([\d.]+)vw$/.exec(pStyle.gap || '');
    if (gapMatch) availH -= (parseFloat(gapMatch[1]) / 100) * parent.clientWidth;

    function fits(vw) {
        container.style.fontSize = vw + 'vw';
        return container.scrollHeight <= availH + 1 && container.scrollWidth <= availW + 1;
    }

    if (!fits(minFont)) {
        container.style.fontSize = minFont + 'vw';
        return Math.max(minFont * scale, 0.5);
    }

    var lo = minFont;
    var hi = maxFont;
    var best = minFont;
    for (var i = 0; i < 14; i++) {
        var mid = Math.round(((lo + hi) / 2) * 100) / 100;
        if (fits(mid)) {
            best = mid;
            lo = mid + 0.1;
        } else {
            hi = mid - 0.1;
        }
    }
    var chosen = Math.max(minFont, Math.round(best * 100) / 100) * scale;
    container.style.fontSize = chosen + 'vw';
    return chosen;
}

// Listen for messages from the main window
window.addEventListener('message', function(e) {
    if (e.source !== window.opener) return;
    if (e.data && e.data.type === 'init') {
        slides = e.data.slides;
        currentIndex = e.data.currentIndex;
        if (e.data.align) window._hymnAlign = e.data.align;
        if (e.data.layout) window._hymnLayout = e.data.layout;
        if (typeof e.data.showNumbers === 'boolean') window._hymnShowNumbers = e.data.showNumbers;
        if (typeof e.data.titleSize === 'number') window._hymnTitleSize = e.data.titleSize;
        if (typeof e.data.fontSize === 'number') window._hymnFontSize = e.data.fontSize;
        if (e.data.transition && ['none', 'fade'].includes(e.data.transition)) _hymnTransition = e.data.transition;
        renderSlide();
    } else if (e.data && e.data.type === 'navigate') {
        currentIndex = e.data.currentIndex;
        renderSlide(true);
    } else if (e.data && e.data.type === 'settingsUpdate') {
        const root = document.documentElement;
        if (e.data.bg) root.style.setProperty('--present-bg', e.data.bg);
        if (e.data.text) root.style.setProperty('--present-text', e.data.text);
        if (e.data.font) root.style.setProperty('--present-font', e.data.font);
        var bgLayer = document.getElementById('bgImageLayer');
        if (bgLayer) {
            if (e.data.bgImage) {
                bgLayer.style.backgroundImage = fileUrlCss(e.data.bgImage);
                bgLayer.style.opacity = String((e.data.bgOpacity || 30) / 100);
                bgLayer.style.display = 'block';
            } else {
                bgLayer.style.display = 'none';
            }
        }
        renderSlide();
    } else if (e.data && e.data.type === 'hymnSettingsUpdate') {
        if (e.data.align) window._hymnAlign = e.data.align;
        if (e.data.layout) window._hymnLayout = e.data.layout;
        if (typeof e.data.showNumbers === 'boolean') window._hymnShowNumbers = e.data.showNumbers;
        if (typeof e.data.titleSize === 'number') window._hymnTitleSize = e.data.titleSize;
        if (typeof e.data.fontSize === 'number') window._hymnFontSize = e.data.fontSize;
        if (e.data.transition && ['none', 'fade'].includes(e.data.transition)) _hymnTransition = e.data.transition;
        renderSlide();
}
}, true);

let _fitTimer = null;
function scheduleRefit() {
    clearTimeout(_fitTimer);
    _fitTimer = setTimeout(function() {
        if (slides.length) renderSlide();
    }, 150);
}
window.addEventListener('resize', scheduleRefit);
document.addEventListener('fullscreenchange', scheduleRefit);
if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleRefit);
}

// Live settings: re-render when a hymn settings key changes in the shared
// localStorage (belt-and-suspenders on top of the postMessage update chain).
var HYMN_SETTING_KEYS = [
    'settings_hymnFontSize',
    'settings_hymnTitleSize',
    'settings_hymnAlign',
    'settings_hymnLayout',
    'settings_hymnShowNumbers',
    'settings_hymnTransition',
];
window.addEventListener('storage', function(e) {
    if (e.key && HYMN_SETTING_KEYS.indexOf(e.key) !== -1 && slides.length) {
        renderSlide();
    }
});

window.addEventListener('load', function() {
    applyThemeFromStorage();
    applyPresenterSettings();
    maximizeWindow();
});

// Keyboard navigation (optional)
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        if (document.fullscreenElement && document.exitFullscreen) {
            try { document.exitFullscreen(); } catch (err) {}
        }
        if (window.presenterApi && window.presenterApi.closeWindow) {
            window.presenterApi.closeWindow();
        } else {
            window.close();
        }
        return;
    }
    if (!slides.length) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') {
        if (currentIndex < slides.length - 1) {
            currentIndex++;
            renderSlide(true);
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ type: 'navigateFromPopup', currentIndex }, '*');
            }
        }
    } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (currentIndex > 0) {
            currentIndex--;
            renderSlide(true);
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ type: 'navigateFromPopup', currentIndex }, '*');
            }
        }
    }
});
</script>
</body>
</html>
